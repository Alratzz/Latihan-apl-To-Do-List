<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>To-Do List</title>
</head>
<body>

    <h2>To-Do List</h2>

    <input type="text" id="tugas" placeholder="Tulis tugas...">

    <button onclick="tambahTugas()">Tambah</button>

    <ul id="daftarTugas">
    </ul>

    <script>
        function tambahTugas() {
            // Mengambil input dari pengguna
            let input = document.getElementById("tugas");

            // Menghapus spasi di awal dan akhir
            let teks = input.value.trim();

            // Memeriksa input kosong
            if (teks === "") {
                alert("Silakan tulis tugas terlebih dahulu!");
                return;
            }

            // Membuat item daftar baru
            let item = document.createElement("li");

            // Memasukkan teks tugas
            item.textContent = teks;

            // Menambahkan tugas ke daftar
            document.getElementById("daftarTugas")
                .appendChild(item);

            // Mengosongkan input
            input.value = "";

            // Mengembalikan fokus ke kotak input
            input.focus();
        }
    </script>

</body>
</html>
